<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ECommerce Stripe Production Test</title>

    <script src="https://js.stripe.com/v3/"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .warning {
            padding: 15px;
            border: 1px solid #ccc;
            margin: 20px 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 15px;
        }

        #payment-element {
            margin-top: 20px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            white-space: pre-wrap;
        }

        #details {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<h1>Stripe Production Test</h1>

<div class="warning">
    <strong>Test mode only</strong><br>
    Use a Stripe test-mode publishable key and the
    4242 4242 4242 4242 test card.
</div>

<label for="orderId">
    Order ID
</label>

<input
    id="orderId"
    type="text"
    placeholder="44e31492-48f3-4c56-9247-51aff3a40847"
>

<label for="accessToken">
    Access Token
</label>

<input
    id="accessToken"
    type="password"
    placeholder="Paste your JWT access token here"
>
<div id="payment-element"></div>

<button id="create-payment-button">
    Create Payment
</button>

<button id="pay-button" disabled>
    Pay
</button>

<div id="message"></div>

<div id="details"></div>


<script>

    // ============================================================

    // ============================================================
    // STATE
    // ============================================================

    let stripe = null;
    let elements = null;
    let paymentElement = null;
    let clientSecret = null;
    let paymentIntentId = null;


    // ============================================================
    // HELPERS
    // ============================================================

    function setMessage(message) {
        document.getElementById("message").textContent = message;
    }

    function setDetails(details) {
        document.getElementById("details").textContent = details;
    }


    // ============================================================
    // CREATE PAYMENT INTENT
    // ============================================================

    document
        .getElementById("create-payment-button")
        .addEventListener("click", async () => {

            const orderId =
                document.getElementById("orderId").value.trim();

            if (!orderId) {
                setMessage("Please enter an Order ID.");
                return;
            }

            const button =
                document.getElementById("create-payment-button");

            button.disabled = true;

            setMessage("Creating PaymentIntent...");
            setDetails("");

            try {

    document.getElementById("accessToken").value.trim();

if (!accessToken) {
    setMessage("Please enter your access token.");
    button.disabled = false;
    return;
}

const response = await fetch(
    `${API_BASE_URL}/orders/${orderId}/pay`,
    {
        method: "POST",
        headers: {
            "Authorization": `Bearer ${accessToken}`,
            "Content-Type": "application/json"
        }
    }
);

const responseText = await response.text();

console.log("HTTP status:", response.status);
console.log("Response body:", responseText);

let result;

try {
    result = responseText
        ? JSON.parse(responseText)
        : null;
}
catch (error) {

    throw new Error(
        `API returned HTTP ${response.status}, ` +
        `but the response was not valid JSON.\n\n` +

    );
}

if (!response.ok) {

    throw new Error(
        result?.message ||
        result?.detail ||

    );
}

if (!result) {
    throw new Error(

    );
}

                console.log("Payment API response:", result);

                if (!response.ok || !result.success) {

                    throw new Error(
                        result.message ||

                    );
                }

                const data = result.data;

                clientSecret = data.clientSecret;
                paymentIntentId = data.paymentIntentId;

                stripe =
                    Stripe(data.publishableKey);

                elements =
                    stripe.elements({

                    });

                paymentElement =
                    elements.create("payment");

                paymentElement.mount("#payment-element");

                document

                    .disabled = false;

                setMessage(

                );

                setDetails(

            }

                console.error(error);

                );

                button.disabled = false;
            }
        });


    // ============================================================
    // CONFIRM PAYMENT
    // ============================================================

    document
        .getElementById("pay-button")
        .addEventListener("click", async () => {

            const button =
                document.getElementById("pay-button");

            button.disabled = true;

            setMessage("Processing payment...");
            setDetails(
                "PaymentIntent ID:\n" +
                paymentIntentId
            );

            try {

                const { error, paymentIntent } =
                    await stripe.confirmPayment({
                        elements,

                        confirmParams: {
                            return_url:
                                window.location.href
                        },

                        redirect: "if_required"
                    });


                if (error) {

                    console.error(error);

                    setMessage(
                        "Payment failed:\n\n" +
                        error.message
                    );

                    button.disabled = false;

                    return;
                }


                console.log(

                if (paymentIntent) {

                    setMessage(

                            .getElementById("orderId")

                    );

            catch (error) {

                console.error(error);

                setMessage(
                    "Unexpected error:\n\n" +
                    error.message
                );

                button.disabled = false;
            }
        });

</script>

</body>
</html>
